<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  
  <title>Gani Pay</title>

　<link rel="manifest" href="manifest.json">
　<link rel="icon" type="image/png" href="icon-512.png?v=2">
　<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=3">
  
　<meta name="apple-mobile-web-app-capable" content="yes">
　<meta name="apple-mobile-web-app-title" content="Gani Pay">
  
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      background: #fff;
    }

    header {
      background: #000;
      color: #fff;
      padding: 22px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 52px;
      height: 52px;
      background: #fff;
      color: #000;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      font-weight: 800;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 3px 0 0;
      font-size: 13px;
      color: #bbb;
    }

    main {
      padding: 20px;
    }

    .summary {
      background: #f2f2f2;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .summary-label {
      font-size: 14px;
      color: #666;
    }

    .summary-amount {
      font-size: 34px;
      font-weight: 800;
      margin-top: 5px;
    }

    .new-button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      background: #000;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      padding: 17px;
      cursor: pointer;
      margin-bottom: 25px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      color: #888;
      background: #fafafa;
      border-radius: 16px;
    }

    .empty strong {
      display: block;
      color: #555;
      margin-bottom: 6px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">GP</div>

    <div>
      <h1>Gani Pay</h1>
      <p>家族のお金をかんたん管理</p>
    </div>
  </header>

  <main>

    <div class="summary">
      <div class="summary-label">現在の請求中</div>
      <div class="summary-amount">¥0</div>
    </div>

    <button class="new-button">
      ＋ 新しい請求を登録
    </button>

    <div class="section-title">
      請求一覧
    </div>

    <div class="empty">
      <strong>まだ請求はありません</strong>
      「新しい請求を登録」から追加できます
    </div>

  </main>

</div>

</body>
</html>
