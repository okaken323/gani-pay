<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>Gani Pay</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-512.png?v=22">
  <link rel="apple-touch-icon" sizes="180x180"
        href="/gani-pay/icon-180.png?v=22">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gani Pay">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
    }

    header {
      background: #000;
      color: #fff;
      padding: 24px 22px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo {
      width: 82px;
      height: 82px;
      flex-shrink: 0;
      background: #000;
      color: #fff;
      border: 1px solid #555;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -2px;
    }

    header h1 {
      margin: 0;
      font-size: 27px;
      font-weight: 800;
    }

    header p {
      margin: 7px 0 0;
      font-size: 14px;
      color: #ccc;
      white-space: nowrap;
    }

    main {
      padding: 20px;
    }

    .summary {
      background: #f3f3f3;
      border-radius: 17px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .summary-label {
      font-size: 15px;
      color: #555;
      margin-bottom: 6px;
    }

    .summary-amount {
      font-size: 38px;
      font-weight: 800;
    }

    button {
      font-family: inherit;
    }

    .new-button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      background: #000;
      color: #fff;
      padding: 17px 14px;
      margin-bottom: 24px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .form-panel {
      display: none;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 17px;
      padding: 18px;
      margin-bottom: 26px;
    }

    .form-panel.open {
      display: block;
    }

    .form-title {
      margin-bottom: 18px;
      font-size: 20px;
      font-weight: 800;
    }

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-width: 0;
      border: 1px solid #ccc;
      border-radius: 11px;
      background: #fff;
      color: #111;
      padding: 13px 12px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .cancel-button,
    .save-button {
      width: 100%;
      padding: 15px 12px;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .cancel-button {
      border: 1px solid #888;
      background: #fff;
    }

    .save-button {
      border: 1px solid #000;
      background: #000;
      color: #fff;
    }

    .save-button:disabled {
      opacity: 0.5;
    }

    .section-title {
      margin: 8px 0 12px;
      font-size: 20px;
      font-weight: 800;
    }

    .list-box {
      background: #f7f7f7;
      border-radius: 17px;
      padding: 16px 18px;
      color: #777;
    }

    .empty-message {
      text-align: center;
      padding: 22px 0;
    }

    .empty-message strong {
      display: block;
      color: #444;
      margin-bottom: 5px;
    }

    .payment-item {
      text-align: left;
      padding: 14px 0;
      border-bottom: 1px solid #ddd;
    }

    .payment-item:last-child {
      border-bottom: 0;
    }

    .payment-row {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 10px;
      align-items: start;
    }

    .paid-payment-row {
      display: block;
    }

    .payment-check-wrap {
      padding-top: 2px;
    }

    .payment-check {
      width: 20px;
      height: 20px;
      margin: 0;
      accent-color: #000;
      cursor: pointer;
    }

    .bulk-panel {
      display: none;
      background: #f7f7f7;
      border: 1px solid #e2e2e2;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .bulk-panel.show {
      display: block;
    }

    .bulk-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .select-all-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .select-all-label input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: #000;
    }

    .selected-count {
      font-size: 13px;
      color: #666;
    }

    .bulk-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .bulk-button {
      border: 1px solid #bbb;
      background: #fff;
      color: #111;
      border-radius: 10px;
      padding: 11px 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .bulk-button.primary {
      border-color: #000;
      background: #000;
      color: #fff;
    }

    .bulk-button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .payment-title {
      font-size: 16px;
      font-weight: 800;
      color: #111;
    }

    .payment-main {
      margin-top: 5px;
      font-size: 15px;
      color: #222;
    }

    .payment-sub {
      margin-top: 4px;
      font-size: 13px;
      color: #777;
    }

    .payment-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .item-action-button {
      border: 1px solid #bbb;
      background: #fff;
      color: #111;
      border-radius: 9px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .item-action-button.delete {
      color: #b00020;
      border-color: #d7a0a8;
    }

    .paid-toggle-button {
      width: 100%;
      margin-top: 24px;
      padding: 15px 16px;
      border: 1px solid #ddd;
      border-radius: 14px;
      background: #f5f5f5;
      color: #111;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .paid-toggle-arrow {
      font-size: 14px;
      transition: transform 0.2s;
    }

    .paid-toggle-button.open .paid-toggle-arrow {
      transform: rotate(180deg);
    }

    .paid-section {
      display: none;
      margin-top: 10px;
    }

    .paid-section.open {
      display: block;
    }

    .paid-status {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #e9e9e9;
      color: #555;
      font-size: 12px;
      font-weight: 700;
    }

    .receipt-note {
      margin-top: 6px;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }

    .receipt-link {
      display: inline-block;
      margin-top: 8px;
      color: #111;
      text-decoration: underline;
      font-size: 13px;
      font-weight: 700;
    }

    .error-message {
      color: #b00020;
      text-align: center;
      line-height: 1.6;
    }

    @media (max-width: 390px) {
      header {
        padding: 20px 17px;
        gap: 14px;
      }

      .logo {
        width: 72px;
        height: 72px;
        font-size: 35px;
      }

      header h1 {
        font-size: 24px;
      }

      header p {
        font-size: 12px;
      }

      main {
        padding: 16px;
      }

      .two-column {
        gap: 9px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">GP</div>

    <div>
      <h1>Gani Pay</h1>
      <p>Gani家族のお金をかんたん管理</p>
    </div>
  </header>

  <main>

    <div class="summary">
      <div class="summary-label">現在の請求中</div>
      <div class="summary-amount" id="summaryAmount">¥0</div>
    </div>

    <button class="new-button" id="openFormButton">
      ＋ 新しい登録
    </button>

    <div class="form-panel" id="formPanel">

      <div class="form-title" id="formTitle">
        新しい登録
      </div>

      <div class="two-column">

        <div class="field">
          <label for="requester">請求する人</label>
          <select id="requester">
            <option value="謙二">謙二</option>
            <option value="理恵">理恵</option>
            <option value="メイサ">メイサ</option>
          </select>
        </div>

        <div class="field">
          <label for="payer">支払う人</label>
          <select id="payer"></select>
        </div>

      </div>

      <div class="two-column">

        <div class="field">
          <label for="content">内容</label>
          <input
            id="content"
            type="text"
            placeholder="例：洗剤、定期代"
          >
        </div>

        <div class="field">
          <label for="amount">金額</label>
          <input
            id="amount"
            name="gani-pay-new-amount-v4"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            autocomplete="off"
            placeholder="例：1280"
          >
        </div>

      </div>

      <div class="field">
        <label for="category">カテゴリー</label>

        <select id="category">
          <option value="">選択してください</option>
          <option value="日用品">日用品</option>
          <option value="食費">食費</option>
          <option value="外食">外食</option>
          <option value="衣服・美容">衣服・美容</option>
          <option value="交通費">交通費</option>
          <option value="教育費">教育費</option>
          <option value="医療費">医療費</option>
          <option value="旅行">旅行</option>
          <option value="お小遣い">お小遣い</option>
          <option value="クルマ">クルマ</option>
          <option value="その他">その他</option>
        </select>
      </div>

      <div class="field">
        <label for="paymentMethod">希望支払い方法</label>

        <select id="paymentMethod">
          <option value="">指定なし</option>
          <option value="銀行振込">銀行振込</option>
          <option value="PayPay">PayPay</option>
          <option value="現金">現金</option>
          <option value="その他">その他</option>
          <option value="家族カード">家族カード</option>
        </select>
      </div>

      <div class="field">
        <label for="memo">メモ（任意）</label>

        <textarea
          id="memo"
          placeholder="必要なときだけ入力"
        ></textarea>
      </div>

      <div class="field">
        <label for="receiptImage">📷 レシート写真（任意）</label>

        <input
          id="receiptImage"
          type="file"
          accept="image/*"
        >
        <div class="receipt-note">
          1件につき1枚。新しい写真を選ぶと差し替えます。
        </div>
      </div>

      <div class="button-row">

        <button
          class="cancel-button"
          id="cancelButton"
          type="button"
        >
          キャンセル
        </button>

        <button
          class="save-button"
          id="saveButton"
          type="button"
        >
          登録する
        </button>

      </div>

    </div>

    <div class="section-title">
      請求中
    </div>

    <div class="bulk-panel" id="bulkPanel">

      <div class="bulk-top">

        <label class="select-all-label">
          <input type="checkbox" id="selectAll">
          すべて選択
        </label>

        <div class="selected-count" id="selectedCount">
          0件選択
        </div>

      </div>

      <div class="bulk-buttons">

        <button
          class="bulk-button primary"
          id="markTransferButton"
          type="button"
          disabled
        >
          送金済みにする
        </button>

        <button
          class="bulk-button"
          id="markCashButton"
          type="button"
          disabled
        >
          現金渡し済みにする
        </button>

      </div>

    </div>

    <div class="list-box" id="activePaymentList">
      <div class="empty-message">
        <strong>読み込み中...</strong>
      </div>
    </div>

    <button
      class="paid-toggle-button"
      id="familyCardToggleButton"
      type="button"
    >
      <span>
        家族カード（<span id="familyCardCount">0</span>件）
      </span>
      <span class="paid-toggle-arrow">▼</span>
    </button>

    <div class="paid-section" id="familyCardSection">
      <div class="list-box" id="familyCardPaymentList"></div>
    </div>

    <button
      class="paid-toggle-button"
      id="paidToggleButton"
      type="button"
    >
      <span>
        支払い済み（<span id="paidCount">0</span>件）
      </span>

      <span class="paid-toggle-arrow">
        ▼
      </span>
    </button>

    <div
      class="paid-section"
      id="paidSection"
    >
      <div
        class="list-box"
        id="paidPaymentList"
      >
      </div>
    </div>

  </main>
</div>

<script>

  const SUPABASE_URL =
    "https://tspmrlaslxgynfspchgz.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_SMiHRlZzMWCZgQ7Msqkgjg_k1olv68o";


  const openFormButton =
    document.getElementById("openFormButton");

  const formPanel =
    document.getElementById("formPanel");

  const cancelButton =
    document.getElementById("cancelButton");

  const saveButton =
    document.getElementById("saveButton");

  const formTitle =
    document.getElementById("formTitle");

  const summaryAmount =
    document.getElementById("summaryAmount");

  const activePaymentList =
    document.getElementById("activePaymentList");

  const paidPaymentList =
    document.getElementById("paidPaymentList");

  const paidToggleButton =
    document.getElementById("paidToggleButton");

  const paidSection =
    document.getElementById("paidSection");

  const paidCount =
    document.getElementById("paidCount");

  const familyCardToggleButton =
    document.getElementById("familyCardToggleButton");

  const familyCardSection =
    document.getElementById("familyCardSection");

  const familyCardPaymentList =
    document.getElementById("familyCardPaymentList");

  const familyCardCount =
    document.getElementById("familyCardCount");

  const requesterSelect =
    document.getElementById("requester");

  const payerSelect =
    document.getElementById("payer");

  const receiptImageInput =
    document.getElementById("receiptImage");

  const bulkPanel =
    document.getElementById("bulkPanel");

  const selectAll =
    document.getElementById("selectAll");

  const selectedCount =
    document.getElementById("selectedCount");

  const markTransferButton =
    document.getElementById("markTransferButton");

  const markCashButton =
    document.getElementById("markCashButton");


  let currentPayments = [];

  const selectedPaymentIds =
    new Set();

  let editingPaymentId =
    null;


  const people = [
    "謙二",
    "理恵",
    "メイサ"
  ];

  const RECEIPT_BUCKET = "receipts";
  const RECEIPT_DELETE_DAYS = 30;


  function encodeStoragePath(path) {
    return String(path)
      .split("/")
      .map(function (part) {
        return encodeURIComponent(part);
      })
      .join("/");
  }


  function getReceiptPublicUrl(path) {
    if (!path) {
      return "";
    }

    return (
      SUPABASE_URL +
      "/storage/v1/object/public/" +
      RECEIPT_BUCKET +
      "/" +
      encodeStoragePath(path)
    );
  }


  function createReceiptHtml(payment) {
    if (!payment.receipt_image) {
      return "";
    }

    return (
      "<a class='receipt-link' " +
      "href='" +
      escapeHtml(
        getReceiptPublicUrl(payment.receipt_image)
      ) +
      "' target='_blank' rel='noopener'>" +
      "📷 レシートを見る" +
      "</a>"
    );
  }


  async function uploadReceipt(file) {
    if (!file) {
      return null;
    }

    if (!String(file.type || "").startsWith("image/")) {
      throw new Error("画像ファイルを選択してください。");
    }

    if (file.size > 10 * 1024 * 1024) {
      throw new Error("レシート写真は10MB以下にしてください。");
    }

    const originalName = String(file.name || "");
    const rawExtension =
      originalName.includes(".")
        ? originalName.split(".").pop()
        : "jpg";

    const extension =
      rawExtension
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "")
        .slice(0, 5) || "jpg";

    const fileName =
      Date.now() +
      "-" +
      Math.random().toString(36).slice(2, 8) +
      "." +
      extension;

    const response =
      await fetch(
        SUPABASE_URL +
          "/storage/v1/object/" +
          RECEIPT_BUCKET +
          "/" +
          encodeStoragePath(fileName),
        {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "Content-Type":
              file.type || "application/octet-stream",
            "x-upsert": "false"
          },
          body: file
        }
      );

    if (!response.ok) {
      const errorText =
        await response.text();

      throw new Error(
        "レシート画像を保存できませんでした。 " +
        response.status +
        " " +
        errorText
      );
    }

    return fileName;
  }


  async function deleteReceiptFile(path) {
    if (!path) {
      return;
    }

    const response =
      await fetch(
        SUPABASE_URL +
          "/storage/v1/object/" +
          RECEIPT_BUCKET +
          "/" +
          encodeStoragePath(path),
        {
          method: "DELETE",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          }
        }
      );

    if (
      !response.ok &&
      response.status !== 404
    ) {
      const errorText =
        await response.text();

      throw new Error(
        "レシート画像を削除できませんでした。 " +
        response.status +
        " " +
        errorText
      );
    }
  }


  async function clearReceiptFromPayment(paymentId) {
    const response =
      await fetch(
        SUPABASE_URL +
          "/rest/v1/payments?id=eq." +
          encodeURIComponent(paymentId),
        {
          method: "PATCH",
          headers: {
            "apikey": SUPABASE_KEY,
            "Content-Type":
              "application/json",
            "Prefer":
              "return=minimal"
          },
          body:
            JSON.stringify({
              receipt_image: null
            })
        }
      );

    if (!response.ok) {
      const errorText =
        await response.text();

      throw new Error(
        "receipt_imageを更新できませんでした。 " +
        response.status +
        " " +
        errorText
      );
    }
  }


  async function cleanupExpiredReceipts(payments) {
    const now = Date.now();
    const limitMs =
      RECEIPT_DELETE_DAYS *
      24 *
      60 *
      60 *
      1000;

    for (const payment of payments) {
      if (
        !isPaidPayment(payment) ||
        !payment.receipt_image ||
        !payment.paid_at
      ) {
        continue;
      }

      const paidTime =
        new Date(payment.paid_at).getTime();

      if (
        !Number.isFinite(paidTime) ||
        now - paidTime < limitMs
      ) {
        continue;
      }

      try {
        await deleteReceiptFile(
          payment.receipt_image
        );

        await clearReceiptFromPayment(
          payment.id
        );

        payment.receipt_image = null;

      } catch (error) {
        console.error(
          "レシート自動削除エラー:",
          error
        );
      }
    }
  }


  function isPaidPayment(payment) {

    return (
      payment.status === "送金済み" ||
      payment.status === "現金渡し済み"
    );

  }


  function updatePayerOptions() {

    const requester =
      requesterSelect.value;

    const oldPayer =
      payerSelect.value;

    payerSelect.innerHTML =
      "";

    people
      .filter(function (person) {

        return person !== requester;

      })
      .forEach(function (person) {

        const option =
          document.createElement("option");

        option.value =
          person;

        option.textContent =
          person;

        payerSelect.appendChild(
          option
        );

      });


    const oldPayerStillAvailable =
      Array.from(
        payerSelect.options
      ).some(function (option) {

        return option.value === oldPayer;

      });


    if (oldPayerStillAvailable) {

      payerSelect.value =
        oldPayer;

    }

  }


  requesterSelect.addEventListener(
    "change",
    updatePayerOptions
  );


  updatePayerOptions();


  function resetForm() {

    editingPaymentId =
      null;

    formTitle.textContent =
      "新しい登録";

    saveButton.textContent =
      "登録する";

    requesterSelect.value =
      "謙二";

    updatePayerOptions();

    document.getElementById(
      "content"
    ).value = "";

    document.getElementById(
      "amount"
    ).value = "";

    document.getElementById(
      "category"
    ).value = "";

    document.getElementById(
      "paymentMethod"
    ).value = "";

    document.getElementById(
      "memo"
    ).value = "";

    receiptImageInput.value = "";

  }


  function openEditForm(paymentId) {

    const payment =
      currentPayments.find(
        function (item) {

          return (
            String(item.id) ===
            String(paymentId)
          );

        }
      );


    if (!payment) {

      alert(
        "編集する請求が見つかりませんでした。"
      );

      return;

    }


    editingPaymentId =
      String(payment.id);

    formTitle.textContent =
      "登録を編集";

    saveButton.textContent =
      "更新する";

    requesterSelect.value =
      payment.requester ||
      "謙二";

    updatePayerOptions();


    const payerExists =
      Array.from(
        payerSelect.options
      ).some(
        function (option) {

          return (
            option.value ===
            payment.payer
          );

        }
      );


    if (payerExists) {

      payerSelect.value =
        payment.payer;

    }


    document.getElementById(
      "content"
    ).value =
      payment.content || "";

    document.getElementById(
      "amount"
    ).value =
      payment.amount ?? "";

    document.getElementById(
      "category"
    ).value =
      payment.category || "";

    document.getElementById(
      "paymentMethod"
    ).value =
      payment.payment_method || "";

    document.getElementById(
      "memo"
    ).value =
      payment.memo || "";


    formPanel.classList.add(
      "open"
    );

    openFormButton.style.display =
      "none";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  openFormButton.addEventListener(
    "click",
    function () {

      resetForm();

      formPanel.classList.add(
        "open"
      );

      openFormButton.style.display =
        "none";

    }
  );


  cancelButton.addEventListener(
    "click",
    function () {

      formPanel.classList.remove(
        "open"
      );

      openFormButton.style.display =
        "block";

      resetForm();

    }
  );


  familyCardToggleButton.addEventListener(
    "click",
    function () {
      const isOpen =
        familyCardSection.classList.toggle("open");

      familyCardToggleButton.classList.toggle(
        "open",
        isOpen
      );
    }
  );


  paidToggleButton.addEventListener(
    "click",
    function () {

      const isOpen =
        paidSection.classList.toggle(
          "open"
        );

      paidToggleButton.classList.toggle(
        "open",
        isOpen
      );

    }
  );


  async function loadPayments() {

    activePaymentList.innerHTML =
      '<div class="empty-message">' +
      '<strong>読み込み中...</strong>' +
      '</div>';

    paidPaymentList.innerHTML =
      "";

    familyCardPaymentList.innerHTML =
      "";


    try {

      const response =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/payments?select=*&order=created_at.asc",

          {
            method: "GET",

            headers: {
              "apikey":
                SUPABASE_KEY
            }
          }

        );


      if (!response.ok) {

        const text =
          await response.text();

        throw new Error(
          response.status +
          " " +
          text
        );

      }


      const payments =
        await response.json();

      await cleanupExpiredReceipts(
        payments
      );

      currentPayments =
        payments;

      selectedPaymentIds.clear();

      renderPayments(
        payments
      );


    } catch (error) {

      console.error(
        "読み込みエラー:",
        error
      );

      activePaymentList.innerHTML =
        '<div class="error-message">' +
        '<strong>データを読み込めませんでした</strong><br>' +
        'Supabase接続を確認してください' +
        '</div>';

    }

  }


  function renderPayments(payments) {

    const activePayments =
      payments.filter(function (payment) {
        return (
          !isPaidPayment(payment) &&
          !payment.card_payment
        );
      });

    const familyCardPayments =
      payments.filter(function (payment) {
        return payment.card_payment === true;
      });

    const paidPayments =
      payments.filter(function (payment) {
        return (
          isPaidPayment(payment) &&
          !payment.card_payment
        );
      });

    const total =
      activePayments.reduce(
        function (sum, payment) {
          return sum + Number(payment.amount || 0);
        },
        0
      );

    summaryAmount.textContent =
      "¥" + total.toLocaleString("ja-JP");

    familyCardCount.textContent =
      familyCardPayments.length;

    paidCount.textContent =
      paidPayments.length;

    bulkPanel.classList.toggle(
      "show",
      activePayments.length > 0
    );

    renderActivePayments(activePayments);
    renderFamilyCardPayments(familyCardPayments);
    renderPaidPayments(paidPayments);
    updateBulkControls();
  }


  function renderActivePayments(
    payments
  ) {

    if (payments.length === 0) {

      activePaymentList.innerHTML =
        '<div class="empty-message">' +
        '<strong>請求中はありません</strong>' +
        'すべて支払い済みです' +
        '</div>';

      return;

    }


    activePaymentList.innerHTML =
      "";


    payments.forEach(
      function (payment) {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "payment-item";


        const paymentMethodText =
          payment.payment_method

            ? "／" +
              escapeHtml(
                payment.payment_method
              )

            : "";


        const memoText =
          payment.memo

            ? "<div class='payment-sub'>" +
              "メモ：" +
              escapeHtml(
                payment.memo
              ) +
              "</div>"

            : "";


        const checked =
          selectedPaymentIds.has(
            String(payment.id)
          )

            ? " checked"

            : "";


        item.innerHTML =

          "<div class='payment-row'>" +

          "<div class='payment-check-wrap'>" +

          "<input " +
          "class='payment-check' " +
          "type='checkbox' " +
          "data-payment-id='" +
          escapeHtml(
            String(payment.id)
          ) +
          "'" +
          checked +
          ">" +

          "</div>" +

          "<div>" +

          "<div class='payment-title'>" +
          escapeHtml(
            payment.content || ""
          ) +
          "</div>" +

          "<div class='payment-main'>" +

          "¥" +
          Number(
            payment.amount || 0
          ).toLocaleString(
            "ja-JP"
          ) +

          "　" +

          escapeHtml(
            payment.requester || ""
          ) +

          " → " +

          escapeHtml(
            payment.payer || ""
          ) +

          "</div>" +

          "<div class='payment-sub'>" +

          formatDate(
            payment.created_at
          ) +

          "<br>" +

          escapeHtml(
            payment.category || ""
          ) +

          paymentMethodText +

          "／請求中" +

          "</div>" +

          memoText +

          createReceiptHtml(
            payment
          ) +

          createActionButtons(
            payment.id
          ) +

          "</div>" +

          "</div>";


        activePaymentList.appendChild(
          item
        );

      }
    );


    document.querySelectorAll(
      "#activePaymentList .payment-check"
    ).forEach(
      function (checkbox) {

        checkbox.addEventListener(
          "change",
          function () {

            const id =
              String(
                checkbox.dataset.paymentId
              );


            if (checkbox.checked) {

              selectedPaymentIds.add(
                id
              );

            } else {

              selectedPaymentIds.delete(
                id
              );

            }


            updateBulkControls();

          }
        );

      }
    );


    attachActionEvents(
      activePaymentList
    );

  }


  function renderFamilyCardPayments(payments) {

    if (payments.length === 0) {
      familyCardPaymentList.innerHTML =
        '<div class="empty-message">' +
        '<strong>家族カード利用はありません</strong>' +
        '</div>';
      return;
    }

    familyCardPaymentList.innerHTML = "";

    payments.forEach(function (payment) {
      const item = document.createElement("div");
      item.className = "payment-item";

      const memoText = payment.memo
        ? "<div class='payment-sub'>メモ：" +
          escapeHtml(payment.memo) +
          "</div>"
        : "";

      item.innerHTML =
        "<div class='paid-payment-row'>" +
        "<div class='payment-title'>" +
        escapeHtml(payment.content || "") +
        "</div>" +
        "<div class='payment-main'>" +
        "¥" + Number(payment.amount || 0).toLocaleString("ja-JP") +
        "　利用者：" + escapeHtml(payment.requester || "") +
        "</div>" +
        "<div class='payment-sub'>" +
        formatDate(payment.created_at) +
        "<br>" +
        escapeHtml(payment.category || "") +
        "／家族カード／請求なし" +
        "</div>" +
        memoText +
        createReceiptHtml(payment) +
        createActionButtons(payment.id) +
        "</div>";

      familyCardPaymentList.appendChild(item);
    });

    attachActionEvents(familyCardPaymentList);
  }


  function renderPaidPayments(
    payments
  ) {

    if (payments.length === 0) {

      paidPaymentList.innerHTML =
        '<div class="empty-message">' +
        '<strong>支払い済みはありません</strong>' +
        '</div>';

      return;

    }


    paidPaymentList.innerHTML =
      "";


    payments.forEach(
      function (payment) {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "payment-item";


        const paymentMethodText =
          payment.payment_method

            ? "／" +
              escapeHtml(
                payment.payment_method
              )

            : "";


        const memoText =
          payment.memo

            ? "<div class='payment-sub'>" +
              "メモ：" +
              escapeHtml(
                payment.memo
              ) +
              "</div>"

            : "";


        item.innerHTML =

          "<div class='paid-payment-row'>" +

          "<div class='payment-title'>" +

          escapeHtml(
            payment.content || ""
          ) +

          "</div>" +

          "<div class='payment-main'>" +

          "¥" +

          Number(
            payment.amount || 0
          ).toLocaleString(
            "ja-JP"
          ) +

          "　" +

          escapeHtml(
            payment.requester || ""
          ) +

          " → " +

          escapeHtml(
            payment.payer || ""
          ) +

          "</div>" +

          "<div class='payment-sub'>" +

          formatDate(
            payment.created_at
          ) +

          "<br>" +

          escapeHtml(
            payment.category || ""
          ) +

          paymentMethodText +

          "</div>" +

          "<div class='paid-status'>" +

          escapeHtml(
            payment.status || "支払い済み"
          ) +

          "</div>" +

          memoText +

          createReceiptHtml(
            payment
          ) +

          createActionButtons(
            payment.id
          ) +

          "</div>";


        paidPaymentList.appendChild(
          item
        );

      }
    );


    attachActionEvents(
      paidPaymentList
    );

  }


  function createActionButtons(
    paymentId
  ) {

    return (

      "<div class='payment-actions'>" +

      "<button " +
      "type='button' " +
      "class='item-action-button edit-payment-button' " +
      "data-payment-id='" +
      escapeHtml(
        String(paymentId)
      ) +
      "'>" +
      "編集" +
      "</button>" +

      "<button " +
      "type='button' " +
      "class='item-action-button delete delete-payment-button' " +
      "data-payment-id='" +
      escapeHtml(
        String(paymentId)
      ) +
      "'>" +
      "削除" +
      "</button>" +

      "</div>"

    );

  }


  function attachActionEvents(
    container
  ) {

    container.querySelectorAll(
      ".edit-payment-button"
    ).forEach(
      function (button) {

        button.addEventListener(
          "click",
          function () {

            openEditForm(
              button.dataset.paymentId
            );

          }
        );

      }
    );


    container.querySelectorAll(
      ".delete-payment-button"
    ).forEach(
      function (button) {

        button.addEventListener(
          "click",
          function () {

            deletePayment(
              button.dataset.paymentId
            );

          }
        );

      }
    );

  }


  function formatDate(
    createdAt
  ) {

    if (!createdAt) {
      return "";
    }

    return new Date(
      createdAt
    ).toLocaleDateString(
      "ja-JP"
    );

  }


  async function deletePayment(
    paymentId
  ) {

    const payment =
      currentPayments.find(
        function (item) {

          return (
            String(item.id) ===
            String(paymentId)
          );

        }
      );


    if (!payment) {

      alert(
        "削除する請求が見つかりませんでした。"
      );

      return;

    }


    const ok =
      confirm(

        "「" +

        (
          payment.content ||
          "この請求"
        ) +

        "」を削除しますか？\n" +

        "この操作は元に戻せません。"

      );


    if (!ok) {
      return;
    }


    try {

      if (payment.receipt_image) {
        await deleteReceiptFile(
          payment.receipt_image
        );
      }

      const response =
        await fetch(

          SUPABASE_URL +

          "/rest/v1/payments?id=eq." +

          encodeURIComponent(
            paymentId
          ),

          {
            method:
              "DELETE",

            headers: {

              "apikey":
                SUPABASE_KEY,

              "Prefer":
                "return=minimal"

            }

          }

        );


      if (!response.ok) {

        const errorText =
          await response.text();

        throw new Error(

          response.status +

          " " +

          errorText

        );

      }


      if (
        String(editingPaymentId) ===
        String(paymentId)
      ) {

        formPanel.classList.remove(
          "open"
        );

        openFormButton.style.display =
          "block";

        resetForm();

      }


      selectedPaymentIds.delete(
        String(paymentId)
      );


      alert(
        "請求を削除しました。"
      );


      await loadPayments();


    } catch (error) {

      console.error(
        "削除エラー:",
        error
      );


      alert(

        "削除できませんでした。\n" +

        "SupabaseのDELETE権限を確認してください。"

      );

    }

  }


  function updateBulkControls() {

    const activePayments =
      currentPayments.filter(
        function (payment) {

          return (
            !isPaidPayment(payment) &&
            !payment.card_payment
          );

        }
      );


    const activeIds =
      activePayments.map(
        function (payment) {

          return String(
            payment.id
          );

        }
      );


    Array.from(
      selectedPaymentIds
    ).forEach(
      function (id) {

        if (
          !activeIds.includes(
            id
          )
        ) {

          selectedPaymentIds.delete(
            id
          );

        }

      }
    );


    const count =
      selectedPaymentIds.size;


    selectedCount.textContent =
      count +
      "件選択";


    markTransferButton.disabled =
      count === 0;

    markCashButton.disabled =
      count === 0;


    selectAll.checked =

      activeIds.length > 0 &&

      activeIds.every(
        function (id) {

          return selectedPaymentIds.has(
            id
          );

        }
      );


    selectAll.indeterminate =

      count > 0 &&

      !selectAll.checked;

  }


  selectAll.addEventListener(
    "change",
    function () {

      const activePayments =
        currentPayments.filter(
          function (payment) {

            return !isPaidPayment(
              payment
            );

          }
        );


      if (selectAll.checked) {

        activePayments.forEach(
          function (payment) {

            selectedPaymentIds.add(
              String(
                payment.id
              )
            );

          }
        );

      } else {

        selectedPaymentIds.clear();

      }


      renderPayments(
        currentPayments
      );

    }
  );


  markTransferButton.addEventListener(
    "click",
    function () {

      markSelectedAsPaid(
        "送金済み"
      );

    }
  );


  markCashButton.addEventListener(
    "click",
    function () {

      markSelectedAsPaid(
        "現金渡し済み"
      );

    }
  );


  async function markSelectedAsPaid(
    status
  ) {

    const ids =
      Array.from(
        selectedPaymentIds
      );


    if (ids.length === 0) {
      return;
    }


    const ok =
      confirm(

        ids.length +

        "件を「" +

        status +

        "」にしますか？"

      );


    if (!ok) {
      return;
    }


    markTransferButton.disabled =
      true;

    markCashButton.disabled =
      true;

    markTransferButton.textContent =
      "更新中...";

    markCashButton.textContent =
      "更新中...";


    try {

      await Promise.all(

        ids.map(
          async function (id) {

            const response =
              await fetch(

                SUPABASE_URL +

                "/rest/v1/payments?id=eq." +

                encodeURIComponent(
                  id
                ),

                {
                  method:
                    "PATCH",

                  headers: {

                    "apikey":
                      SUPABASE_KEY,

                    "Content-Type":
                      "application/json",

                    "Prefer":
                      "return=minimal"

                  },

                  body:
                    JSON.stringify({
                      status:
                        status,
                      paid_at:
                        new Date().toISOString()
                    })

                }

              );


            if (!response.ok) {

              const errorText =
                await response.text();

              throw new Error(

                response.status +

                " " +

                errorText

              );

            }

          }
        )

      );


      alert(

        ids.length +

        "件を「" +

        status +

        "」にしました。"

      );


      selectedPaymentIds.clear();


      await loadPayments();


    } catch (error) {

      console.error(
        "支払い済み更新エラー:",
        error
      );


      alert(

        "支払い状態を更新できませんでした。\n" +

        "SupabaseのUPDATE権限を確認してください。"

      );


    } finally {

      markTransferButton.textContent =
        "送金済みにする";

      markCashButton.textContent =
        "現金渡し済みにする";

      updateBulkControls();

    }

  }


  function escapeHtml(
    value
  ) {

    return String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  saveButton.addEventListener(
    "click",
    async function () {

      const requester =
        requesterSelect.value;

      const payer =
        payerSelect.value;

      const content =
        document.getElementById(
          "content"
        ).value.trim();

      const amount =
        document.getElementById(
          "amount"
        ).value.trim();

      const category =
        document.getElementById(
          "category"
        ).value;

      const paymentMethod =
        document.getElementById(
          "paymentMethod"
        ).value;

      const memo =
        document.getElementById(
          "memo"
        ).value.trim();

      const receiptFile =
        receiptImageInput.files &&
        receiptImageInput.files.length > 0
          ? receiptImageInput.files[0]
          : null;


      if (
        requester === payer
      ) {

        alert(
          "請求する人と支払う人は別の人を選んでください。"
        );

        return;

      }


      if (!content) {

        alert(
          "内容を入力してください。"
        );

        return;

      }


      if (
        !amount ||
        Number(amount) <= 0
      ) {

        alert(
          "金額を入力してください。"
        );

        return;

      }


      if (!category) {

        alert(
          "カテゴリーを選択してください。"
        );

        return;

      }


      const isEditing =
        editingPaymentId !== null;


      saveButton.disabled =
        true;

      saveButton.textContent =
        isEditing
          ? "更新中..."
          : "登録中...";


      let newReceiptPath = null;
      let oldReceiptPath = null;

      try {

        const isFamilyCard =
          paymentMethod === "家族カード";

        const editingPayment =
          isEditing
            ? currentPayments.find(
                function (payment) {
                  return (
                    String(payment.id) ===
                    String(editingPaymentId)
                  );
                }
              )
            : null;

        oldReceiptPath =
          editingPayment &&
          editingPayment.receipt_image
            ? editingPayment.receipt_image
            : null;

        if (receiptFile) {
          saveButton.textContent =
            "写真を保存中...";

          newReceiptPath =
            await uploadReceipt(
              receiptFile
            );
        }

        const payload = {
          requester: requester,
          payer: payer,
          content: content,
          amount: Number(amount),
          category: category,
          payment_method:
            paymentMethod || null,
          memo: memo || null,
          card_payment: isFamilyCard
        };

        if (newReceiptPath) {
          payload.receipt_image =
            newReceiptPath;
        }

        if (isEditing) {

          if (isFamilyCard) {
            payload.status =
              "家族カード利用";
            payload.paid_at = null;

          } else if (
            editingPayment &&
            editingPayment.card_payment
          ) {
            payload.status =
              "請求中";
            payload.paid_at = null;
          }

        }


        let response;


        if (isEditing) {

          response =
            await fetch(

              SUPABASE_URL +

              "/rest/v1/payments?id=eq." +

              encodeURIComponent(
                editingPaymentId
              ),

              {
                method:
                  "PATCH",

                headers: {

                  "apikey":
                    SUPABASE_KEY,

                  "Content-Type":
                    "application/json",

                  "Prefer":
                    "return=minimal"

                },

                body:
                  JSON.stringify(
                    payload
                  )

              }

            );

        } else {

          payload.status =
            isFamilyCard
              ? "家族カード利用"
              : "請求中";

          response = await fetch(
            SUPABASE_URL +
              "/rest/v1/payments",
            {
              method: "POST",
              headers: {
                "apikey": SUPABASE_KEY,
                "Content-Type": "application/json",
                "Prefer": "return=minimal"
              },
              body: JSON.stringify(payload)
            }
          );

        }


        if (!response.ok) {

          const errorText =
            await response.text();

          throw new Error(

            response.status +

            " " +

            errorText

          );

        }


        if (
          newReceiptPath &&
          oldReceiptPath &&
          newReceiptPath !== oldReceiptPath
        ) {
          try {
            await deleteReceiptFile(
              oldReceiptPath
            );
          } catch (error) {
            console.error(
              "旧レシート削除エラー:",
              error
            );
          }
        }


        alert(

          isEditing

            ? "登録を更新しました。"

            : "登録しました。"

        );


        formPanel.classList.remove(
          "open"
        );

        openFormButton.style.display =
          "block";

        resetForm();

        await loadPayments();


      } catch (error) {

        console.error(
          "保存エラー:",
          error
        );

        if (newReceiptPath) {
          try {
            await deleteReceiptFile(
              newReceiptPath
            );
          } catch (cleanupError) {
            console.error(
              "新規レシート後始末エラー:",
              cleanupError
            );
          }
        }


        alert(

          "保存できませんでした。\n" +

          (error && error.message
            ? error.message
            : "Supabase接続を確認してください。")

        );


      } finally {

        saveButton.disabled =
          false;

        saveButton.textContent =
          "登録する";

      }

    }
  );


  loadPayments();

</script>
