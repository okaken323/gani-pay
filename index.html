<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>Gani Pay</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-512.png?v=8">
  <link rel="apple-touch-icon" sizes="180x180" href="/gani-pay/icon-180.png?v=12">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gani Pay">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
    }

    /* =========================
       ヘッダー
       ========================= */

    header {
      background: #000;
      color: #fff;
      padding: 24px 22px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo {
      width: 82px;
      height: 82px;
      flex-shrink: 0;
      background: #000;
      color: #fff;
      border: 1px solid #555;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -2px;
    }

    .header-text {
      min-width: 0;
    }

    header h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.15;
      font-weight: 800;
    }

    header p {
      margin: 7px 0 0;
      font-size: 14px;
      color: #ccc;
      white-space: nowrap;
    }

    /* =========================
       メイン
       ========================= */

    main {
      padding: 20px;
    }

    .summary {
      background: #f3f3f3;
      border-radius: 17px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .summary-label {
      font-size: 15px;
      color: #555;
      margin-bottom: 6px;
    }

    .summary-amount {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.1;
    }

    /* =========================
       ボタン
       ========================= */

    button {
      font-family: inherit;
    }

    .new-button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      background: #000;
      color: #fff;
      padding: 17px 14px;
      margin-bottom: 24px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    /* =========================
       入力フォーム
       ========================= */

    .form-panel {
      display: none;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 17px;
      padding: 18px;
      margin-bottom: 26px;
    }

    .form-panel.open {
      display: block;
    }

    .form-title {
      margin-bottom: 18px;
      font-size: 20px;
      font-weight: 800;
    }

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-width: 0;
      border: 1px solid #ccc;
      border-radius: 11px;
      background: #fff;
      color: #111;
      padding: 13px 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #777;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .optional-button {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 11px;
      background: #fff;
      color: #111;
      padding: 13px 12px;
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }

    .optional-area {
      display: none;
      padding: 14px;
      margin-bottom: 16px;
      background: #f4f4f4;
      border-radius: 13px;
    }

    .optional-area.open {
      display: block;
    }

    .optional-area .field {
      margin-bottom: 0;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 4px;
    }

    .cancel-button,
    .save-button {
      width: 100%;
      padding: 15px 12px;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .cancel-button {
      border: 1px solid #888;
      background: #fff;
      color: #111;
    }

    .save-button {
      border: 1px solid #000;
      background: #000;
      color: #fff;
    }

    .notice {
      margin-top: 15px;
      color: #777;
      font-size: 12px;
      line-height: 1.55;
    }

    /* =========================
       請求一覧
       ========================= */

    .section-title {
      margin: 8px 0 12px;
      font-size: 20px;
      font-weight: 800;
    }

    .empty {
      background: #f7f7f7;
      border-radius: 17px;
      padding: 44px 20px;
      text-align: center;
      color: #777;
      line-height: 1.7;
    }

    .empty strong {
      display: block;
      margin-bottom: 4px;
      color: #444;
      font-size: 16px;
    }

    /* =========================
       スマホ微調整
       ========================= */

    @media (max-width: 390px) {
      header {
        padding: 20px 17px;
        gap: 14px;
      }

      .logo {
        width: 72px;
        height: 72px;
        font-size: 35px;
      }

      header h1 {
        font-size: 24px;
      }

      header p {
        font-size: 12px;
      }

      main {
        padding: 16px;
      }

      .two-column {
        gap: 9px;
      }

      input,
      select {
        padding-left: 10px;
        padding-right: 8px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">GP</div>

    <div class="header-text">
      <h1>Gani Pay</h1>
      <p>家族のお金をかんたん管理</p>
    </div>
  </header>

  <main>

    <div class="summary">
      <div class="summary-label">現在の請求中</div>
      <div class="summary-amount">¥0</div>
    </div>

    <button class="new-button" id="openFormButton">
      ＋ 新しい請求を登録
    </button>

    <div class="form-panel" id="formPanel">

      <div class="form-title">
        新しい請求
      </div>

      <div class="two-column">

        <div class="field">
          <label for="requester">請求する人</label>
          <select id="requester">
            <option value="謙二">謙二</option>
            <option value="理恵">理恵</option>
            <option value="メイサ">メイサ</option>
          </select>
        </div>

        <div class="field">
          <label for="payer">支払う人</label>
          <select id="payer">
            <option value="謙二">謙二</option>
            <option value="理恵">理恵</option>
            <option value="メイサ">メイサ</option>
          </select>
        </div>

      </div>

      <div class="two-column">

        <div class="field">
          <label for="content">内容</label>
          <input
            id="content"
            type="text"
            placeholder="例：洗剤、定期代"
          >
        </div>

        <div class="field">
          <label for="amount">金額</label>
          <input
            id="amount"
            type="number"
            inputmode="numeric"
            min="1"
            placeholder="例：1280"
          >
        </div>

      </div>

      <div class="field">
        <label for="category">カテゴリー</label>
        <select id="category">
          <option value="">選択してください</option>
          <option value="日用品">日用品</option>
          <option value="食費">食費</option>
          <option value="外食">外食</option>
          <option value="衣服・美容">衣服・美容</option>
          <option value="交通費">交通費</option>
          <option value="教育費">教育費</option>
          <option value="医療費">医療費</option>
          <option value="旅行">旅行</option>
          <option value="お小遣い">お小遣い</option>
          <option value="クルマ">クルマ</option>
          <option value="その他">その他</option>
        </select>
      </div>

　　　　<div class="field">
 　　　　 <label for="paymentMethod">希望支払い方法</label>

　　　　  <select id="paymentMethod">
    　　　<option value="">指定なし</option>
    　　　<option value="銀行振込">銀行振込</option>
   　　　 <option value="PayPay">PayPay</option>
    　　　<option value="現金">現金</option>
   　　　 <option value="その他">その他</option>
  　　　</select>
　　　</div>

      <div class="field">
        <label for="memo">メモ（任意）</label>

        <textarea
          id="memo"
          placeholder="必要なときだけ入力"
        ></textarea>
      </div>

      <div class="button-row">

        <button class="cancel-button" id="cancelButton">
          キャンセル
        </button>

        <button class="save-button" id="saveButton">
          登録する
        </button>

      </div>

      <div class="notice">
        ※ 現在は入力画面までです。次にSupabaseへ接続して、登録データを家族で共有できるようにします。
      </div>

    </div>

    <div class="section-title">
      請求一覧
    </div>

    <div class="empty">
      <strong>まだ請求はありません</strong>
      「新しい請求を登録」から追加できます
    </div>

  </main>

</div>

<script>
<script>
  const SUPABASE_URL = "https://tspmrlaslxgynfspchgz.supabase.co";
  const SUPABASE_KEY = "sb_publishable_SMiHRlZzMWCZgQ7Msqkgjg_k1olv68o";

  const openFormButton =
    document.getElementById("openFormButton");

  const formPanel =
    document.getElementById("formPanel");

  const cancelButton =
    document.getElementById("cancelButton");

  const saveButton =
    document.getElementById("saveButton");

  const summaryAmount =
    document.querySelector(".summary-amount");

  const emptyArea =
    document.querySelector(".empty");

  const sectionTitle =
    document.querySelector(".section-title");


  openFormButton.addEventListener("click", () => {
    formPanel.classList.add("open");
    openFormButton.style.display = "none";

    setTimeout(() => {
      formPanel.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }, 50);
  });


  cancelButton.addEventListener("click", () => {
    formPanel.classList.remove("open");
    openFormButton.style.display = "block";
  });


  async function loadPayments() {

    try {

      const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/payments?select=*&order=created_at.desc",
        {
          headers: {
            "apikey": SUPABASE_KEY
          }
        }
      );

      if (!response.ok) {
        throw new Error(
          "読み込みエラー: " + response.status
        );
      }

      const payments = await response.json();

      renderPayments(payments);

    } catch (error) {

      console.error(error);

      emptyArea.innerHTML =
        "<strong>データを読み込めませんでした</strong>" +
        "通信状態を確認してください";

    }
  }


  function renderPayments(payments) {

    const activePayments =
      payments.filter(payment =>
        payment.status !== "送金済み" &&
        payment.status !== "現金渡し済み"
      );

    const total =
      activePayments.reduce(
        (sum, payment) =>
          sum + Number(payment.amount || 0),
        0
      );

    summaryAmount.textContent =
      "¥" + total.toLocaleString("ja-JP");


    if (payments.length === 0) {

      emptyArea.innerHTML =
        "<strong>まだ請求はありません</strong>" +
        "「新しい請求を登録」から追加できます";

      return;
    }


    emptyArea.innerHTML = "";

    payments.forEach(payment => {

      const item =
        document.createElement("div");

      item.style.textAlign = "left";
      item.style.padding = "14px 0";
      item.style.borderBottom =
        "1px solid #ddd";

      const paymentMethodText =
        payment.payment_method
          ? "／" + payment.payment_method
          : "";

      item.innerHTML =
        "<strong>" +
        payment.content +
        "</strong>" +
        "<div style='margin-top:5px'>" +
        "¥" +
        Number(payment.amount)
          .toLocaleString("ja-JP") +
        "　" +
        payment.requester +
        " → " +
        payment.payer +
        "</div>" +
        "<div style='margin-top:4px;font-size:13px;color:#777'>" +
        payment.category +
        paymentMethodText +
        "／" +
        (payment.status || "請求中") +
        "</div>";

      emptyArea.appendChild(item);

    });
  }


  saveButton.addEventListener(
    "click",
    async () => {

      const requester =
        document.getElementById("requester").value;

      const payer =
        document.getElementById("payer").value;

      const content =
        document.getElementById("content")
          .value.trim();

      const amount =
        document.getElementById("amount").value;

      const category =
        document.getElementById("category").value;

      const paymentMethod =
        document.getElementById("paymentMethod")
          .value;

      const memo =
        document.getElementById("memo")
          .value.trim();


      if (!content) {
        alert("内容を入力してください。");
        return;
      }

      if (!amount || Number(amount) <= 0) {
        alert("金額を入力してください。");
        return;
      }

      if (!category) {
        alert("カテゴリーを選択してください。");
        return;
      }


      saveButton.disabled = true;
      saveButton.textContent = "登録中...";


      try {

        const response = await fetch(
          SUPABASE_URL + "/rest/v1/payments",
          {
            method: "POST",

            headers: {
              "apikey": SUPABASE_KEY,
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
            },

            body: JSON.stringify({
              requester: requester,
              payer: payer,
              content: content,
              amount: Number(amount),
              category: category,
              payment_method:
                paymentMethod || null,
              memo: memo || null,
              status: "請求中"
            })
          }
        );


        if (!response.ok) {

          const errorText =
            await response.text();

          throw new Error(errorText);

        }


        alert("請求を登録しました。");


        document.getElementById("content")
          .value = "";

        document.getElementById("amount")
          .value = "";

        document.getElementById("category")
          .value = "";

        document.getElementById("paymentMethod")
          .value = "";

        document.getElementById("memo")
          .value = "";


        formPanel.classList.remove("open");

        openFormButton.style.display =
          "block";


        await loadPayments();


      } catch (error) {

        console.error(error);

        alert(
          "登録できませんでした。\n" +
          "Supabase設定を確認してください。"
        );

      } finally {

        saveButton.disabled = false;
        saveButton.textContent = "登録する";

      }

    }
  );


  loadPayments();

</script>
</script>

</body>
</html>
